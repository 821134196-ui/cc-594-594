# 公交卡挂失补卡与余额转移系统
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173

# SQLite 数据库（相对路径基于进程工作目录）。db-kind 取任意自定义值并显式给出驱动类，
# 让 Quarkus 为非内置数据库创建数据源。
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${BUSCARD_DB:data/buscard.db}
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=0

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

quarkus.log.category."com.buscard".level=INFO
