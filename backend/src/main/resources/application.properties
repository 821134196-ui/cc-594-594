# ===== DataSource: SQLite（quarkiverse jdbc-sqlite 注册 db-kind=sqlite）=====
quarkus.datasource.db-kind=sqlite
# SQLite 单连接串行化，彻底避免 SQLITE_BUSY；演示场景顺序处理足够
quarkus.datasource.jdbc.url=jdbc:sqlite:data/transit.db?journal_mode=WAL&busy_timeout=10000
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.acquisition-timeout=30S

# ===== Hibernate ORM =====
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ===== HTTP =====
quarkus.http.port=8080
quarkus.http.cors=true

# 演示数据文件（由 DataInitializer 使用）
app.data-dir=data
